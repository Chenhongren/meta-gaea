name: Analyze 

on:
  push:

jobs:
  run-check:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install tools
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-format-17 cppcheck

    - name: Run clang-format
      run: clang-format-17 -i $(find . -name "*.cpp" -o -name "*.c" -o -name "*.hpp" -o -name "*.h")

    - name: Run cppcheck
      run: cppcheck --enable=all --std=c++20 --suppress=missingIncludeSystem .
