<!DOCTYPE busconfig PUBLIC
"-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="xyz.gaea.i2c_tool"/>
    <allow send_destination="xyz.gaea.i2c_tool"/>
    <allow send_interface="xyz.gaea.i2c_tool"/>
    <allow receive_sender="xyz.gaea.i2c_tool" receive_type="signal"/>
  </policy>
</busconfig>
